# Windows/Linux: runs Ollama in Docker too. Run: docker compose up --build
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
  app:
    build: .
    ports: ["8081:8080"]
    environment:
      OLLAMA_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b}
    depends_on: [ollama]
volumes:
  ollama:
